[project]
name = "ai-engineering"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
 requires-python = ">=3.11, <3.14"



dependencies = [
    "datasets>=4.8.5",
    "fastembed>=0.8.0",
    "google-genai>=2.6.0",
    "httpx>=0.28.1",
    "ipykernel>=7.2.0",
    "langchain-community>=0.4.2",
    "langchain-openai>=0.3.0",
    "langsmith>=0.9.7",
    "openai>=2.38.0",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.2",
    "qdrant-client>=1.18.0",
    "ragas>=0.4.3",
    "streamlit>=1.57.0",
]

[tool.uv.workspace]
members = [
    "apps/api",
]

[dependency-groups]
dev = [
    "cohere>=7.0.8",
    "langgraph-checkpoint-postgres>=3.1.2",
    "matplotlib>=3.10.9",
    "psycopg2-binary>=2.9.12",
]
